<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtRabs</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="particles"></div>

<header>
    <div class="logo">
        ARTRABS
        <span>CORE SYSTEM</span>
    </div>

    <div class="balance-box">
        <div class="balance" id="balance">0</div>
        <small>MULTI STARS</small>
    </div>
</header>


<main>

<section class="core-area">

<div class="energy-ring"></div>

<button class="core" id="clicker">
    <div class="core-inner">
        <span>ART</span>
        <strong>CORE</strong>
    </div>
</button>

<div id="gain"></div>

<p class="hint">
Нажимайте для добычи энергии
</p>

</section>



<section class="stats">

<div class="card">
<h3>WORKERS</h3>
<p id="workers">0</p>
</div>

<div class="card">
<h3>LEVEL</h3>
<p id="level">1</p>
</div>

<div class="card">
<h3>INCOME</h3>
<p id="income">0/week</p>
</div>

</section>


</main>


<nav>

<button>
CORE
</button>

<button>
WORKERS
</button>

<button>
CASES
</button>

<button>
RANK
</button>

<button>
PROFILE
</button>

</nav>


<script src="script.js"></script>

</body>
</html>
